name: Update market charts

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Collect market data
        run: python update_market.py

      - name: Check market data
        run: |
          python - <<'PY'
          import json
          with open("market.json", encoding="utf-8") as f:
              data = json.load(f)
          usable = []
          for name, market in data.get("markets", {}).items():
              print(name, market.get("status"), market.get("asof"))
              if market.get("price") is not None and len(market.get("daily", [])) >= 2:
                  usable.append(name)
          if not usable:
              raise SystemExit("No usable market data. Check Collect market data logs.")
          print("Usable markets:", ", ".join(usable))
          PY

      - name: Save market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market data"
            git push
          fi

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p public
          cp index.html market.json public/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
