<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Market Monitor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f3f6ff;font-family:Arial,sans-serif}
main{max-width:1300px;margin:auto;padding:28px 18px}
h1{font-size:28px;margin:8px 0}
.subtitle{color:#9eabc5;font-size:13px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#151d31;border:1px solid #28344e;border-radius:14px;padding:14px;min-width:0}
h2{font-size:17px;margin:2px 0 12px}
.chart{height:360px}
.wide{margin-top:16px}
.compare{height:520px}
.note{color:#9eabc5;font-size:12px;line-height:1.7}
a{color:#a8c7ff}
@media(max-width:760px){.grid{grid-template-columns:1fr}.chart{height:320px}}
</style>
</head>
<body>
<main>
<h1>Global Market Monitor</h1>
<div class="subtitle">KOSPI · KOSDAQ · NASDAQ · NYSE | 한국·미국 주식시장</div>
<div class="grid">
<section class="card"><h2>KOSPI</h2><div class="chart" id="kospi"></div></section>
<section class="card"><h2>KOSDAQ</h2><div class="chart" id="kosdaq"></div></section>
<section class="card"><h2>NASDAQ</h2><div class="chart" id="nasdaq"></div></section>
<section class="card"><h2>NYSE Composite</h2><div class="chart" id="nyse"></div></section>
</div>
<section class="card wide">
<h2>4개 시장 성과 비교</h2>
<div class="compare" id="comparison"></div>
</section>
<p class="note">시세는 거래소 정책에 따라 지연될 수 있습니다. 차트가 표시되지 않으면 <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>에서 확인하세요.</p>
</main>
<script>
function addWidget(id,symbols,scale){
const root=document.getElementById(id);
const wrap=document.createElement("div");
wrap.className="tradingview-widget-container";
wrap.style.cssText="height:100%;width:100%";
const inner=document.createElement("div");
inner.className="tradingview-widget-container__widget";
inner.style.cssText="height:100%;width:100%";
wrap.appendChild(inner);
root.appendChild(wrap);
const script=document.createElement("script");
script.type="text/javascript";
script.src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
script.async=true;
script.textContent=JSON.stringify({
symbols:symbols,
chartOnly:false,
width:"100%",
height:"100%",
locale:"kr",
colorTheme:"dark",
autosize:true,
showVolume:false,
showMA:false,
hideDateRanges:false,
hideMarketStatus:false,
hideSymbolLogo:false,
scalePosition:"right",
scaleMode:scale,
fontFamily:"Arial, sans-serif",
fontSize:"12",
noTimeScale:false,
valuesTracking:"1",
changeMode:"price-and-percent",
chartType:"area",
lineWidth:2,
lineType:0
});
wrap.appendChild(script);
}
addWidget("kospi",[["KOSPI","KRX:KOSPI|1D"]],"Normal");
addWidget("kosdaq",[["KOSDAQ","KRX:KOSDAQ|1D"]],"Normal");
addWidget("nasdaq",[["NASDAQ","NASDAQ:IXIC|1D"]],"Normal");
addWidget("nyse",[["NYSE","NYSE:NYA|1D"]],"Normal");
addWidget("comparison",[
["KOSPI","KRX:KOSPI|1M"],
["KOSDAQ","KRX:KOSDAQ|1M"],
["NASDAQ","NASDAQ:IXIC|1M"],
["NYSE","NYSE:NYA|1M"]
],"Percentage");
</script>
</body>
</html>
